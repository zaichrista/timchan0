<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-key="site_title">Your Name — Portfolio</title>
  <meta name="description" content="Portfolio of Your Name.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a href="#top" class="logo" data-key="brand_name">Your Name</a>
    <nav><a href="#work">Work</a><a href="#about">About</a><a href="#contact">Contact</a></nav>
  </header>

  <main id="top">
    <section class="hero">
      <h1 data-key="hero_title">Designer &amp; maker of things.</h1>
      <p data-key="hero_subtitle">A one-line intro about what you do and who you do it for.</p>
    </section>

    <section id="work">
      <h2 data-key="work_title">Selected work</h2>
      <div class="grid" data-list="Projects">
        <!-- Default content, replaced once the sheet loads -->
        <div class="card"><div class="thumb"></div><div class="body"><h3>Project One</h3><small>Branding · 2026</small><p>A short description.</p></div></div>
        <template>
          <a class="card" data-field-href="link">
            <div class="thumb"></div>
            <div class="body">
              <h3 data-field="title"></h3>
              <small><span data-field="category"></span> · <span data-field="year"></span></small>
              <p data-field="summary"></p>
            </div>
          </a>
        </template>
      </div>
    </section>

    <section id="about">
      <h2 data-key="about_title">About</h2>
      <p class="multiline" data-key="about_bio">Write a short bio here.</p>
    </section>

    <section id="contact">
      <h2 data-key="contact_title">Get in touch</h2>
      <p><a data-href-key="email_link" data-key="contact_email" href="mailto:you@example.com">you@example.com</a>
         · <a data-href-key="instagram_url" data-key="instagram_label" href="#">Instagram</a></p>
      <form id="contact-form" novalidate>
        <label>Name <input name="name" required></label>
        <label>Email <input name="email" type="email" required></label>
        <label>Message <textarea name="message" rows="5" required></textarea></label>
        <input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button type="submit">Send</button>
        <p id="form-status" role="status"></p>
      </form>
    </section>
  </main>

  <footer><small data-key="footer_text">© Your Name</small></footer>

  <script src="config.js"></script>
  <script src="content.js"></script>
  <script src="contact.js"></script>
</body>
</html>
